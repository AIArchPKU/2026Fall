# Site settings
course_name: "Hardware Architecture for Intelligent Computing Systems"
course_description: "本课程主要介绍智能硬件系统的设计理论、方法与关键技术，课程内容与具体安排将在开课前陆续更新。"
course_semester: "Fall 2026"
course_email: "AIArchPKU@163.com"

baseurl: "/2026Fall" # the subpath of your site, e.g. /blog/
url: "https://aiarchpku.com" # the base hostname & protocol for your site
repository: "AIArchPKU/2026Fall"

schoolname: "Peking University"
schoolurl: "https://pku.edu.cn"

address: |
    School of Yuanpei
    Peking Univ.
    Beijing

# Set your Google Analytics tracking ID (set up yours at http://www.google.com/analytics/)
# google_analytics: UA-XXXXXXXX-X

### Do not change the followings unless you know what you are doing ###

# Build settings
markdown: kramdown

# Other options
permalink: blog/:year/:month/:title
excerpt_separator: "<!--more-->"

include: ['_images', '_css']
exclude:
    - develop
    - Gemfile
    - Gemfile.lock
    - LICENSE
    - README.md
    - _templates

dateformat: "%m/%d/%Y"

future: true
collections:
    events:
        output: true
    lectures:
        output: true
    assignments:
        output: true
    announcements:
        output: false
    finals:
        output: true

defaults:
  - scope:
      path: ""
      type: "assignments"
    values:
      layout: "assignment"
